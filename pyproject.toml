[project]
name = "stetho"
version = "0.1.0"
description = "Phone-video condition screening for small pumps and motors, compared with each machine's own baseline."
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=2.0", "scipy>=1.11", "opencv-python-headless>=4.8", "fastapi>=0.110",
                "uvicorn>=0.27", "python-multipart>=0.0.9", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
